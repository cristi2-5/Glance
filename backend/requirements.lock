# GENERATED FILE - do not edit by hand.
# Exact versions of every runtime dependency, so the container build is
# reproducible (pyproject.toml only holds ranges). Regenerate after changing
# dependencies in pyproject.toml, from backend/ (Git Bash; on other shells
# adjust the path syntax). The existing lock is passed to pip as constraints,
# so nothing moves except what pyproject.toml forces; to upgrade one package,
# delete its line from this file first. A fresh resolve (rather than
# `pip freeze` of the built image) is what makes a removed dependency, and
# everything only it needed, actually disappear from the lock:
#   docker run --rm -v "$(pwd -W):/src:ro" python:3.11-slim-bookworm sh -c '
#     python -c "import tomllib; print(*tomllib.load(open(\"/src/pyproject.toml\", \"rb\"))[\"project\"][\"dependencies\"], sep=\"\n\")" > /tmp/deps.txt
#     python -m venv /v && /v/bin/pip install -q -c /src/requirements.lock -r /tmp/deps.txt
#     /v/bin/pip freeze | grep -vi glance-backend' > new.lock   # then replace the pins below with new.lock
# The image swaps opencv-python for the headless build at the same version
# (see the Dockerfile), which is why the lock names opencv-python. Then re-run
# the test stage: docker compose --profile test run --rm test
