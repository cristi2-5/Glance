[project]
name = "glance-backend"
version = "0.1.0"
description = "Glance — local backend for book cover recognition, RAG and recommendations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.2,<3.0",
    "rapidocr-onnxruntime>=1.3,<2.0",
    "pillow>=10.4,<11.0",
    "ollama>=0.3,<1.0",
    "chromadb>=0.5,<1.0",
    "httpx>=0.27,<1.0",
    "rapidfuzz>=3.10,<4.0",
    "structlog>=24.4,<25.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "black>=24.10,<25.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-python-jose>=3.3,<4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: tests that call Ollama or other slow services",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
