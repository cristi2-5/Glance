[project]
name = "glance-backend"
version = "0.1.0"
description = "Glance — backend for book cover recognition, RAG and recommendations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.2,<3.0",
    "rapidocr-onnxruntime>=1.3,<2.0",
    "pillow>=10.4,<11.0",
    "ollama>=0.3,<1.0",
    "groq>=1.6,<2.0",
    "httpx>=0.27,<1.0",
    "rapidfuzz>=3.10,<4.0",
    "structlog>=24.4,<25.0",
    "python-multipart>=0.0.12,<1.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "azure-storage-blob>=12.24,<13.0",
    "azure-storage-queue>=12.12,<13.0",
    "azure-identity>=1.19,<2.0",
    "aiohttp>=3.10,<4.0",
    # Observability (cloud step 6). The OpenTelemetry API/SDK/exporter move
    # together (1.x); the instrumentation packages are 0.x betas versioned
    # against them (0.66b0 pairs with 1.45), hence the tight upper bound.
    "opentelemetry-api>=1.45,<2.0",
    "opentelemetry-sdk>=1.45,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
    "opentelemetry-instrumentation-httpx>=0.66b0,<0.67",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<0.67",
    "azure-core-tracing-opentelemetry>=1.0.0b12,<2.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b50,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "black>=24.10,<25.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-python-jose>=3.3,<4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: tests that call Ollama or other slow services",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
