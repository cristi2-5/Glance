# Alembic configuration. The database URL is deliberately NOT here: it comes
# from Settings (DATABASE_URL) in migrations/env.py, so no credential ever
# sits in a committed file. Tests set `sqlalchemy.url` programmatically.
[alembic]
script_location = %(here)s/migrations
# Relative to this file, not the cwd, so `alembic -c backend/alembic.ini` also imports `app`.
prepend_sys_path = %(here)s
path_separator = os
# Revision files are named by their number, e.g. 0001_baseline.py.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
