# Runs Glance the way it will run in the cloud: separate containers on a private network.
services:
  postgres:
    # pgvector image: the vectors (book_chunks, book_profiles) live in this
    # same database; migration 0002 runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg17
    environment:
      # Dev-only credentials; in Azure there is no password (Entra ID token).
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: glance
      POSTGRES_DB: glance
    ports:
      # Host-side pytest only (TEST_DATABASE_URL). Bound to localhost so the
      # database is not exposed on the LAN. Connect via 127.0.0.1 (on Windows
      # "localhost" tries IPv6 first and adds ~2 s to every connection).
      - "127.0.0.1:5433:5432"
    volumes:
      - glance-pg:/var/lib/postgresql/data
      # Creates the second database `glance_test` on first start.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP (-h), not the socket: on a fresh volume the entrypoint first
      # runs a socket-only server for the init scripts, which would pass a
      # socket check while `migrate` (connecting over TCP) is still refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U glance -d glance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  azurite:
    # Microsoft's official Azure Storage emulator: the real Blob and Queue APIs,
    # so the code uses the real Azure SDK and only the connection string changes
    # in Azure. Pinned, because a moved tag changes the emulated API surface.
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    # Blob + queue only (no table service). 0.0.0.0 so other containers reach it
    # by service name; --skipApiVersionCheck because the Azure SDK always sends
    # its newest API version, which an emulator release can lag behind; --loose
    # tolerates request headers the emulator does not model.
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
      - --loose
    ports:
      # Host-side pytest only (the default connection string in config.py).
      # Localhost-bound: the emulator's account key is public knowledge.
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
    volumes:
      - azurite-data:/data
    healthcheck:
      # The image ships node, not curl: a TCP connect to both listeners.
      test:
        - CMD
        - node
        - -e
        - "const n=require('net');let d=0;for(const p of [10000,10001]){const c=n.connect(p,'127.0.0.1',()=>{c.end();if(++d===2)process.exit(0)});c.on('error',()=>process.exit(1))}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    # One-shot: applies the schema, then exits. Not done at api startup because
    # several api replicas would race each other; in Azure this becomes a
    # Container Apps Job. Same image as api, different command.
    # No `build:` here: only api builds `glance-backend`. Two services building
    # the same tag export it concurrently and one fails with "already exists".
    image: glance-backend
    pull_policy: never
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://glance:glance@postgres:5432/glance
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: glance-backend
    # Secrets are injected at run time, never baked into the image
    # (Key Vault references play this role in Azure).
    env_file: backend/.env
    environment:
      # Inside the compose network, services are reached by name.
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://glance:glance@postgres:5432/glance
      # Azurite's well-known public development account, addressed by its
      # in-network hostname. Azure Storage (managed identity) replaces it in Azure.
      AZURE_STORAGE_CONNECTION_STRING: &azurite-connection >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      # Telemetry (cloud step 6): OTLP over HTTP to the Aspire Dashboard below.
      # The api and the queue worker push there; the `test` service gets none
      # of this, so the suite stays offline. Metrics every 10 s (not the
      # production 60) so the dashboard fills in while you watch.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18890
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "10"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      azurite:
        condition: service_healthy
      # Started first so the first spans have somewhere to go; not waited on for
      # health (telemetry export fails soft, a down dashboard must not stop the app).
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  worker:
    # The queue worker: takes scan/refresh messages off the queue and runs the
    # pipeline (vision, catalogs, embeddings). Same image as api, different
    # command; no ports, nothing calls it. Scale it independently of the api
    # (`docker compose up -d --scale worker=2`): every message is processed by
    # exactly one replica at a time.
    image: glance-backend
    pull_policy: never
    env_file: backend/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://glance:glance@postgres:5432/glance
      AZURE_STORAGE_CONNECTION_STRING: *azurite-connection
      # Telemetry (cloud step 6): OTLP over HTTP to the Aspire Dashboard below.
      # The api and the queue worker push there; the `test` service gets none
      # of this, so the suite stays offline. Metrics every 10 s (not the
      # production 60) so the dashboard fills in while you watch.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18890
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "10"
    command: ["python", "-m", "app.workers.queue_worker"]
    # On `stop` the queue worker finishes the message in hand before exiting,
    # and a scan takes 30-120 s; compose's default 10 s would SIGKILL it
    # mid-job (the message would reappear, but the work is wasted).
    stop_grace_period: 150s
    # The image's HEALTHCHECK probes the api's port 8000, which the queue
    # worker never serves, so it is replaced by the queue worker's own liveness
    # endpoint (loop ticking, or a message younger than JOB_MAX_RUNTIME_SECONDS).
    # No port is published: only this in-container probe asks.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      azurite:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  test:
    # The backend suite inside Linux on the locked versions:
    #   docker compose --profile test run --rm test
    # Not started by a plain `docker compose up` (profile). Needs no .env: the
    # tests set what they need, and the database is the `glance_test` one
    # created by postgres/init, never the one the api uses.
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://glance:glance@postgres:5432/glance_test
      AZURE_STORAGE_CONNECTION_STRING: *azurite-connection
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy

  aspire-dashboard:
    # Microsoft's free OpenTelemetry viewer: traces, metrics and structured logs
    # of api and queue worker in one UI, http://127.0.0.1:18888. It is the local
    # stand-in for Application Insights (cloud step 6); the app code is the same,
    # only the endpoint differs. Pinned, because a moved tag changes the UI.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    # Local only, bound to localhost: it shows every request the app made, and
    # both auth modes are switched off so no token has to be copied from the
    # container log. Never expose this port or reuse these settings elsewhere.
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:18888:18888"
    # The OTLP receivers (18889 gRPC, 18890 HTTP) are deliberately not published:
    # only api and worker push to them, by service name on the compose network.
    # Telemetry is kept in memory only; a restart empties the dashboard.
    # It idles at ~150-250 MB on a laptop with 7.4 GB that also runs Ollama:
    # capped so a burst of traces cannot starve the model.
    mem_limit: 300m
    restart: unless-stopped

  ollama:
    build: ./ollama
    # No "ports:" on purpose: only the api container can reach it. This mirrors
    # Azure Container Apps' internal ingress.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  glance-pg:
  azurite-data:
